<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Primary SEO Metadata -->
    <title>Reflections Journal — Private AI-Powered Reflective Journaling</title>
    <meta name="description" content="A private sanctuary for deep reflection. Capture inner dialogue, explore 3-angle brainstorming perspectives, and reflect with a thoughtful Gemini AI companion. Strictly secured with Cloud Firestore." />
    <meta name="keywords" content="reflective journal, AI journal, Gemini AI, private journaling, mindfulness diary, 3-angle brainstorming, gratitude journal, Cloud Firestore journal" />
    <meta name="author" content="Reflections Journal" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://reflections-journals.ai.studio/" />

    <!-- Mobile App & Theme Styling -->
    <meta name="theme-color" content="#0c0a09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Reflections" />
    <meta name="application-name" content="Reflections Journal" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reflections Journal" />
    <meta property="og:title" content="Reflections Journal — Private AI-Powered Reflective Journaling" />
    <meta property="og:description" content="Capture inner dialogue, explore 3-angle brainstorming perspectives, and reflect with a mindful Gemini AI companion. Strictly secured with Cloud Firestore." />
    <meta property="og:url" content="https://reflections-journals.ai.studio/" />
    <meta property="og:image" content="https://reflections-journals.ai.studio/og-preview.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reflections Journal - AI Companion for Mindful Thought" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reflections Journal — Private AI-Powered Reflective Journaling" />
    <meta name="twitter:description" content="Capture inner dialogue, explore 3-angle brainstorming perspectives, and reflect with a mindful Gemini AI companion." />
    <meta name="twitter:image" content="https://reflections-journals.ai.studio/og-preview.svg" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Reflections Journal",
      "url": "https://reflections-journals.ai.studio/",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "All",
      "description": "User-authenticated, private reflective journaling application powered by Gemini AI and Cloud Firestore with multi-turn conversation and 3-angle brainstorming.",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "softwareVersion": "1.0.0",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Multi-turn conversational reflections with Gemini AI",
        "Brainstorm mode with 3 angles: Philosophical, Pragmatic, and Contrarian",
        "User-isolated Cloud Firestore document persistence",
        "Google Federated Authentication with zero passwords stored",
        "Themed category filtering and reflection search",
        "One-click AI reflection summaries"
      ]
    }
    </script>
  </head>
  <body class="bg-stone-950 text-stone-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
