<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#292524" stroke-width="2" />

  <!-- App Badge -->
  <g transform="translate(100, 100)">
    <rect width="320" height="42" rx="21" fill="#292524" stroke="#44403c" stroke-width="1" />
    <circle cx="24" cy="21" r="6" fill="#fbbf24" />
    <text x="42" y="26" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">GEMINI AI + CLOUD FIRESTORE</text>
  </g>

  <!-- Title -->
  <text x="100" y="220" fill="#f5f5f4" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1">
    Reflections Journal
  </text>
  <text x="100" y="280" fill="#fbbf24" font-family="Georgia, Cambria, 'Times New Roman', serif" font-style="italic" font-size="36" font-weight="400">
    A private sanctuary for your deepest reflections.
  </text>

  <!-- Description -->
  <text x="100" y="360" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Multi-turn reflective dialogue and 3-angle brainstorming powered by Gemini AI.
  </text>
  <text x="100" y="396" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
    Private, encrypted, and isolated to your authenticated Google account.
  </text>

  <!-- Features Pills -->
  <g transform="translate(100, 470)">
    <rect width="210" height="48" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5" />
    <text x="24" y="30" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">✦ Empathetic Dialogue</text>
  </g>
  <g transform="translate(330, 470)">
    <rect width="230" height="48" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5" />
    <text x="24" y="30" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">✦ 3-Angle Brainstorming</text>
  </g>
  <g transform="translate(580, 470)">
    <rect width="210" height="48" rx="14" fill="#1c1917" stroke="#44403c" stroke-width="1.5" />
    <text x="24" y="30" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">✦ Cloud Firestore</text>
  </g>
</svg>
